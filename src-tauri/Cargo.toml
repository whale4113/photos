[package]
name = "photos-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "photos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "collation"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
base64 = "0.22"
sha2 = "0.10"
walkdir = "2"
rfd = "0.15"
trash = "5"
notify = "8"
kamadak-exif = "0.6"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
